function norm(o){if(!o||!Array.isArray(o.tx))return null;return{v:1,cur:CUR[o.cur]?o.cur:'KZT',open:+o.open||0,bud:o.bud&&typeof o.bud=='object'?o.bud:{},last:Object.assign({ex:'food',in:'salary'},o.last||{}),tx:o.tx.filter(x=>x&&x.a>0&&isFinite(x.t)&&(x.type=='ex'||x.type=='in')).map(x=>({id:String(x.id||uid()),t:+x.t,a:+x.a,type:x.type,cat:String(x.cat||'other'),n:String(x.n||'').slice(0,80)}))}}

function sums(idx){let i=0,e=0;const c={};for(const x of DB.tx){if(mi(x.t)!==idx)continue;if(x.type=='in')i+=x.a;else{e+=x.a;c[x.cat]=(c[x.cat]||0)+x.a}}return{i,e,c}}
const rs=(f,t)=>{let i=0,e=0;for(const x of DB.tx)if(x.t>=f&&x.t<=t){if(x.type=='in')i+=x.a;else e+=x.a}return{i,e}};
const balance=b=>DB.open+DB.tx.reduce((s,x)=>(b==null||x.t<b)?s+(x.type=='in'?x.a:-x.a):s,0);
const dim=idx=>new Date(Math.floor(idx/12),idx%12+1,0).getDate();
const elapsed=idx=>idx==mi(Date.now())?new Date().getDate():dim(idx);
function insights(idx){
 const s=sums(idx),p=sums(idx-1),out=[],cur=idx==mi(Date.now()),P0=cur?'В этом месяце':'В выбранном месяце',el=elapsed(idx);
 if(p.e>0&&s.e>0){const d=Math.round((s.e-p.e)/p.e*100);out.push(d==0?P0+' расходы на уровне прошлого месяца.':`${P0} ты потратил на ${Math.abs(d)}% ${d>0?'больше':'меньше'}, чем в прошлом.`)}
 const top=Object.entries(s.c).sort((a,b)=>b[1]-a[1])[0];
 if(top)out.push(`Больше всего денег уходит на «${nm('ex',top[0])}» — ${Math.round(top[1]/s.e*100)}% расходов.`);
 if(cur&&el>=3&&s.e>0)out.push(`Если продолжишь в таком темпе, к концу месяца потратишь ${M(s.e/el*dim(idx))}.`);
 if(s.i>0){const r=(s.i-s.e)/s.i;out.push(r>=0?`За этот месяц тебе удалось сохранить ${Math.round(r*100)}% дохода.`:`Расходы превышают доходы на ${M(s.e-s.i)}.`)}
 for(const [k,l] of Object.entries(DB.bud)){const v=s.c[k]||0;if(l>0&&v>=.8*l)out.push(v>=l?`Бюджет «${nm('ex',k)}» превышен на ${M(v-l)}.`:`Бюджет «${nm('ex',k)}» использован на ${Math.round(v/l*100)}%.`)}
 return out}

const S={m:mi(Date.now())};
const sh=i=>`hsl(0 0% ${96-i*7}%)`;
function donut(c,tot){const C=2*Math.PI*70;let off=0;const en=Object.entries(c).sort((a,b)=>b[1]-a[1]);
 const segs=en.map(([k,v],i)=>{const L=v/tot*C,el=`<circle class="seg-c" cx="90" cy="90" r="70" fill="none" stroke="${sh(i)}" stroke-width="22" stroke-dasharray="${Math.max(L-(en.length>1?2:0),.5)} ${C}" stroke-dashoffset="${-off}"/>`;off+=L;return el}).join('');
 return `<div class="dc"><svg viewBox="0 0 180 180" class="dn" role="img" aria-label="Расходы по категориям"><g transform="rotate(-90 90 90)">${segs}</g></svg><div><span class="mut sm">Расходы</span><b>${M(tot)}</b></div></div><div class="lg">${en.map(([k,v],i)=>`<div><i style="background:${sh(i)}"></i><span>${nm('ex',k)}</span><span class="mut">${Math.round(v/tot*100)}%</span><span>${M(v)}</span></div>`).join('')}</div>`}
function line(idx){const n=elapsed(idx),st=new Date(Math.floor(idx/12),idx%12,1).getTime();let b=balance(st);const pts=[b],dn=Array(n).fill(0);
 DB.tx.forEach(x=>{if(mi(x.t)==idx){const d=new Date(x.t).getDate()-1;if(d<n)dn[d]+=x.type=='in'?x.a:-x.a}});dn.forEach(v=>{b+=v;pts.push(b)});
 const mn=Math.min(...pts),r=(Math.max(...pts)-mn)||1,X=i=>i/(pts.length-1)*600,Y=v=>165-(v-mn)/r*145;
 const d=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
 return `<svg viewBox="0 0 600 180" preserveAspectRatio="none" class="ln" role="img" aria-label="Изменение баланса"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${d}L600 180L0 180Z" fill="url(#lg)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg><div class="axis"><span>1-е число</span><span>Баланс на конец периода: ${M(pts[pts.length-1])}</span><span>${n}-е</span></div>`}
function report(idx){const s=sums(idx),p=sums(idx-1),en=Object.entries(s.c).sort((a,b)=>b[1]-a[1]);

 if(s.i>0)t+=`Сбережения: ${Math.round((s.i-s.e)/s.i*100)}% дохода\n`;
 if(p.e>0)t+=`Расходы к прошлому месяцу: ${s.e>=p.e?'+':'−'}${Math.round(Math.abs(s.e-p.e)/p.e*100)}%\n`;
 if(en.length)t+='\nРасходы по категориям:\n'+en.map(([k,v])=>`— ${nm('ex',k)}: ${M(v)} (${Math.round(v/s.e*100)}%)`).join('\n')+'\n';
 const bl=Object.entries(DB.bud).filter(([k,l])=>l>0);if(bl.length)t+='\nБюджеты:\n'+bl.map(([k,l])=>{const v=s.c[k]||0;return `— ${nm('ex',k)}: ${M(v)} из ${M(l)} (${Math.round(v/l*100)}%)`}).join('\n')+'\n';
 return t.trim()}
function vAn(){

${has?`<section class="card"><h2>Помощник</h2>${ins.length?ins.map(t=>`<p class="ins">${t}</p>`).join(''):empty('Пока мало данных','Добавьте больше операций.')}</section>

function vBud(){const idx=mi(Date.now()),s=sums(idx);let lim=0,sp=0;

/* CSV */
function csv(t){t=t.replace(/^\ufeff/,'');const f=t.split('\n',1)[0],dl=[';','\t',','].map(d=>[d,f.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0],R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==dl){r.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}
function pd(s){s=s.trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/);if(m)return new Date(+m[1],m[2]-1,+m[3],+(m[4]||12),+(m[5]||0)).getTime();
 m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return new Date(y,m[2]-1,+m[1],+(m[4]||12),+(m[5]||0)).getTime()}return NaN}
function mapCSV(R){const h=R[0].map(x=>x.trim().toLowerCase()),fi=re=>h.findIndex(x=>re.test(x));
 const ci={d:fi(/дата|date/),a:fi(/сумма|amount|sum/),n:fi(/описан|назнач|коммент|description|details|merchant|название|memo/),c:fi(/категор|categor/),t:fi(/тип|type/)};
 if(ci.d<0||ci.a<0)return{err:'Не найдены столбцы «Дата» и «Сумма». Добавьте заголовки в первую строку файла.'};
 const out=[];let bad=0;
 for(const r of R.slice(1)){const t=pd(r[ci.d]||'');let s=(r[ci.a]||'').replace(/[\s\u00a0]/g,'').replace('−','-');s=s.includes('.')&&s.includes(',')?s.replace(/,/g,''):s.replace(',','.');const v=parseFloat(s.replace(/[^0-9.\-+]/g,''));
  if(isNaN(t)||isNaN(v)||v==0){bad++;continue}
  let type=v<0?'ex':'in';if(ci.t>=0){const x=(r[ci.t]||'').toLowerCase();if(/расх|expense|debit|списан|withdraw/.test(x))type='ex';else if(/дох|income|credit|поступ|deposit/.test(x))type='in'}
  const cn0=ci.c>=0?(r[ci.c]||'').trim().toLowerCase():'',cat=((type=='in'?IN:EX).find(c=>c[1].toLowerCase()==cn0)||['other'])[0];
  out.push({id:uid(),t,a:Math.abs(v),type,cat,n:ci.n>=0?(r[ci.n]||'').trim().slice(0,80):''})}
 return{out,bad}}
const key=x=>x.t+'|'+x.a+'|'+x.type+'|'+x.n;
async function onCSV(f){if(!f)return;let R,res;
 try{const b=await f.arrayBuffer();if(/\.pdf$/i.test(f.name)||f.type=='application/pdf'){res=await readPDF(b)}else{let t=new TextDecoder('utf-8').decode(b);if(t.includes('\ufffd'))t=new TextDecoder('windows-1251').decode(b);R=csv(t);if(R.length<2)throw 0;res=mapCSV(R)}}catch(e){return openM(`<div class="mh"><h3>Импорт операций</h3>${closeBtn}</div><p>Не удалось прочитать файл. Для CSV нужны заголовки и хотя бы одна операция, для PDF — выписка Kaspi Gold из приложения.</p>`)}
 if(res.err)return openM(`<div class="mh"><h3>Импорт операций</h3>${closeBtn}</div><p>${res.err}</p>`);
 const have=new Map();DB.tx.forEach(x=>have.set(key(x),(have.get(key(x))||0)+1));const fresh=res.out.filter(x=>{const k=key(x),c=have.get(k)||0;if(c>0){have.set(k,c-1);return false}return true});IMP=fresh;
 const i=fresh.filter(x=>x.type=='in').length;
 openM(`<div class="mh"><h3>Импорт операций</h3>${closeBtn}</div><p>Новых операций: <b>${fresh.length}</b> (доходов ${i}, расходов ${fresh.length-i}).<br><span class="mut">Повторов пропущено: ${res.out.length-fresh.length}. Строк с ошибками: ${res.bad}.</span></p>${fresh.length?`<button class="pri" data-act="impok">Импортировать</button>`:''}<button class="gh" data-act="close">Отмена</button>`)}

/* Выписка Kaspi Gold (PDF) */
/* В приложении PDF.js лежит внутри (папка pdfjs/), интернет не нужен. Если папки нет — берём из сети. */
let CDN='pdfjs/';const CDN_NET='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const addPdfJs=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u+'pdf.min.js';s.onload=ok;s.onerror=()=>{s.remove();no()};document.head.append(s)});
const loadPdfJs=()=>window.pdfjsLib?Promise.resolve():addPdfJs(CDN).catch(()=>{CDN=CDN_NET;return addPdfJs(CDN)});
const KW=[[/magnum|small|galmart|галмарт|маркет|market|ресторан|кафе|cafe|coffee|pizza|burger|wolt|glovo|chocofood|kfc|dodo|пекар|продукт|food/i,'food'],[/yandex|яндекс|taxi|такси|indrive|бензин|азс|helios|sinooil|qazaq oil|onay|parking|парковк|автобус/i,'transport'],[/netflix|spotify|apple|google|youtube|steam|icloud|chatgpt|openai|подписк/i,'subs'],[/аптек|pharm|apteka|europharma|клиник|clinic|стомат|invivo|olymp/i,'health'],[/кино|cinema|kino|театр|playstation|боулинг|bowling/i,'fun'],[/wildberries|ozon|technodom|sulpak|mechta|zara|lcw|одежд|магазин|shop|store/i,'shop'],[/университет|школ|курс|udemy|coursera|колледж/i,'edu'],[/коммунал|аренд|квартир|электр|водоканал|отоплен/i,'home'],[/air astana|scat|flyarystan|hotel|booking|aviata|chocotravel|отель|авиа/i,'travel']];
async function readPDF(buf){
 try{await loadPdfJs()}catch(e){return{err:'Не удалось загрузить модуль чтения PDF. Проверьте интернет и повторите.'}}
 pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.worker.min.js';
 const doc=await pdfjsLib.getDocument({data:buf}).promise,lines=[];
 for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent(),rows=[];
  for(const it of tc.items){if(!it.str.trim())continue;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r)rows.push(r={y,c:[]});r.c.push([it.transform[4],it.str])}
  rows.sort((a,b)=>b.y-a.y).forEach(r=>lines.push(r.c.sort((a,b)=>a[0]-b[0]).map(c=>c[1]).join(' ')))}
 const out=[];
 for(const l of lines){const m=l.replace(/\u00a0/g,' ').match(/^\s*(\d{2})\.(\d{2})\.(\d{2,4})\s+([+\-−–])\s*(\d[\d ]*,\d{2})(?![\d.])\s*₸?\s*(\S+)?\s*(.*)$/);if(!m)continue;
  const y=+m[3]<100?2000+ +m[3]:+m[3],a=parseFloat(m[5].replace(/ /g,'').replace(',','.')),t=new Date(y,m[2]-1,+m[1],12).getTime();
  if(!(a>0)||isNaN(t))continue;
  const type=m[4]=='+'?'in':'ex',op=m[6]||'',det=(m[7]||'').trim(),txt=op+' '+det,buy=/покупка|сатып|purchase/i.test(op);
  const cat=type=='in'?(/зарплат|salary|заработн/i.test(txt)?'salary':'other'):((KW.find(k=>k[0].test(txt))||[0,'other'])[1]);
  out.push({id:uid(),t,a,type,cat,n:((buy?'':op+' ')+det).trim().slice(0,80)})}
 return out.length?{out,bad:0}:{err:'Операции в файле не найдены. Формат выписки может отличаться от ожидаемого.'}}

 if(!b){if(e.target.id=='ov')closeM();return}

 else if(a=='clr')openM(`<div class="mh"><h3>Удалить все данные?</h3>${closeBtn}</div><p class="mut">Все операции, бюджеты и настройки будут удалены без возможности восстановления.</p><button class="pri" data-act="doclr">Удалить всё</button><button class="gh" data-act="close">Отмена</button>`)

 if(t.dataset.bud){const v=num(t.value);if(t.value.trim()==''||v==0)delete DB.bud[t.dataset.bud];else if(v>0)DB.bud[t.dataset.bud]=v;else toast('Введите положительную сумму');save();render()}

save();render(true);
